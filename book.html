<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reader - AccessLearn</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav aria-label="Book Navigation">
        <div class="nav-container">
            <div class="logo">
                <a href="#" id="back-link"
                    style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Module</span>
                </a>
            </div>
            <div class="user-controls">
                <button id="audio-mode-toggle" aria-label="Toggle Audio Mode"><i class="fas fa-headphones"></i> Audio
                    Mode</button>
            </div>
        </div>
    </nav>

    <main id="main-content">
        <section class="module-container" style="max-width: 800px; margin: 2rem auto; padding: 2rem;">
            <div id="book-header" style="text-align: center; margin-bottom: 2rem;">
                <i id="book-icon" class="fas fa-book-open"
                    style="font-size: 4rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
                <h1 id="book-title">Loading Book...</h1>
                <h3 id="book-author" style="color: #666;"></h3>
            </div>

            <div class="card" style="padding: 3rem; font-size: 1.25rem; line-height: 1.8;">
                <div id="book-content" style="white-space: pre-wrap;">
                    Please select a valid book.
                </div>
            </div>

            <div class="controls"
                style="text-align: center; margin-top: 2rem; display: flex; gap: 1rem; justify-content: center;">
                <button id="play-book" class="cta-button"><i class="fas fa-play"></i> Read Aloud</button>
                <button id="pause-book" class="secondary-button"><i class="fas fa-pause"></i> Pause</button>
                <button id="stop-book" class="secondary-button"><i class="fas fa-stop"></i> Stop</button>
            </div>
        </section>
    </main>

    <script src="client-api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const moduleId = params.get('moduleId');
            const bookIndex = parseInt(params.get('bookIndex'));
            const libraryBookName = params.get('libraryBook');

            const titleEl = document.getElementById('book-title');
            const authorEl = document.getElementById('book-author');
            const contentEl = document.getElementById('book-content');
            const backLink = document.getElementById('back-link');

            let synthesis = window.speechSynthesis;
            let currentUtterance = null;
            let currentBookContent = "";

            // Wait for voices to be loaded
            let voices = [];
            function loadVoices() {
                voices = synthesis.getVoices();
            }
            loadVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }

            if (libraryBookName) {
                // HANDLE DIGITAL LIBRARY BOOK
                backLink.href = "index.html#library";
                backLink.innerHTML = '<i class="fas fa-arrow-left"></i> Back to Library';

                titleEl.textContent = libraryBookName;
                authorEl.textContent = "Digital Library Collection";

                // Dictionary for library books
                const libraryContent = {
                    "Space Science": "Space is a three-dimensional continuum containing positions and directions. In classical physics, physical space is often conceived in three linear dimensions. Space science encompasses all of the scientific disciplines that involve space exploration and study natural phenomena and physical bodies occurring in outer space, such as space medicine and astrobiology.",
                    "Great History": "History is the study of change over time, and it covers all aspects of human society. Political, social, economic, scientific, technological, and cultural developments are all part of history. Great historical events have shaped the world we live in today, from the rise and fall of empires to the industrial revolution.",
                    "Computer Basics": "A computer is a machine that can be instructed to carry out sequences of arithmetic or logical operations automatically via computer programming. Modern computers have the ability to follow generalized sets of operations, called programs. These programs enable computers to perform an extremely wide range of tasks."
                };

                currentBookContent = libraryContent[libraryBookName] || "Content not found for this library book.";
                contentEl.textContent = currentBookContent;

            } else if (moduleId && !isNaN(bookIndex)) {
                backLink.href = `module.html?id=${moduleId}`;
                try {
                    const data = await api.getCourseById(moduleId);

                    if (data && data.books && data.books[bookIndex]) {
                        const book = data.books[bookIndex];
                        titleEl.textContent = book.title;
                        authorEl.textContent = `by ${book.author}`;
                        contentEl.textContent = book.content || "No content available for this book.";
                        currentBookContent = contentEl.textContent;
                    } else {
                        throw new Error('Book not found');
                    }
                } catch (err) {
                    titleEl.textContent = "Error Loading Book";
                    contentEl.textContent = "Could not load the book content.";
                    console.error(err);
                }

            } else if (params.get('storyBook')) {
                // HANDLE STORIES
                backLink.href = "index.html#library";
                backLink.querySelector('span').textContent = 'Back to Library';

                const storyKey = params.get('storyBook');

                const stories = {
                    "lion-mouse": {
                        title: "The Lion and the Mouse",
                        author: "Aesop's Fables",
                        icon: "fas fa-paw",
                        content: `Once upon a time, a mighty Lion lay sleeping in the forest. A tiny Mouse, not watching where she was running, accidentally ran across the Lion's nose and woke him up.\n\nThe Lion angrily caught the Mouse and roared, "How dare you wake me! I shall eat you for this!"\n\nThe trembling Mouse cried, "Please, great Lion, spare me! I did not mean to disturb you. If you let me go, perhaps I can help you one day."\n\nThe Lion laughed and said, "Ha! A tiny Mouse help ME? That is the funniest thing I have ever heard!" But the Lion was in a good mood, so he let the Mouse go.\n\nA few days later, the Lion was prowling through the forest when he fell into a hunter's net. He roared and struggled, but the ropes only tightened around him.\n\nThe little Mouse heard the Lion's roars and ran to see what had happened. She saw her friend trapped in the net. Without a moment's hesitation, the Mouse began gnawing on the ropes with her sharp little teeth.\n\nGnaw, gnaw, gnaw. One by one, the ropes snapped apart. Soon, the Lion was free!\n\n"You laughed when I said I could help you," said the Mouse. "But you see, even a small mouse can help a mighty lion."\n\nThe Lion bowed his great head humbly and said, "You are right, little friend. I was wrong to laugh. Thank you — you have saved my life."\n\nFrom that day on, the Lion and the Mouse were the best of friends.\n\nMoral: No act of kindness, however small, is ever wasted. Even the mighty may need the help of the weak.`
                    },
                    "cinderella": {
                        title: "Cinderella",
                        author: "Classic Fairy Tale",
                        icon: "fas fa-crown",
                        content: `Once upon a time, in a kingdom far away, there lived a kind and gentle girl named Cinderella. She lived with her stepmother and two stepsisters, who made her do all the chores. Despite being treated poorly, Cinderella remained cheerful and hopeful.\n\nOne day, an invitation arrived from the royal palace. The Prince was hosting a grand ball, and all the young women in the kingdom were invited. Cinderella's stepsisters were excited, but her stepmother told Cinderella she could not go.\n\nAs Cinderella sat alone weeping, her Fairy Godmother appeared in a swirl of sparkles.\n\n"Dry your tears, my dear," said the Fairy Godmother. "You SHALL go to the ball!"\n\nWith a wave of her magic wand, she turned a pumpkin into a golden carriage, mice into white horses, and Cinderella's ragged clothes into a beautiful shimmering gown. On Cinderella's feet appeared a pair of delicate glass slippers.\n\n"Remember," the Fairy Godmother warned, "the magic will end at the stroke of midnight. Be home before the clock strikes twelve!"\n\nAt the ball, the Prince noticed Cinderella the moment she walked in. They danced together all evening, and the Prince was completely enchanted by her grace and kindness.\n\nThen the clock began to strike midnight — BONG! BONG! BONG!\n\nCinderella remembered the warning. She ran from the ballroom as fast as she could. In her hurry, she lost one of her glass slippers on the palace stairs.\n\nThe next morning, the Prince declared he would search the entire kingdom for the girl whose foot fit the glass slipper. When the Prince's men arrived at Cinderella's home, her stepsisters both tried on the slipper, but it fit neither of them.\n\nThen Cinderella asked if she could try. Her stepmother laughed, but the Prince insisted. Cinderella sat down, and the slipper slid perfectly onto her foot. Then she pulled the other slipper from her pocket.\n\nThe Prince recognized her immediately. "It is you!" he cried joyfully.\n\nCinderella and the Prince were married shortly after. They lived happily ever after, and Cinderella showed kindness and forgiveness even to her stepsisters.\n\nMoral: Kindness, patience, and a pure heart will always be rewarded.`
                    },
                    "tortoise-hare": {
                        title: "The Tortoise and the Hare",
                        author: "Aesop's Fables",
                        icon: "fas fa-running",
                        content: `Once upon a time, in a forest filled with animals of all kinds, there lived a Hare who was very proud of how fast he could run.\n\nEvery day, the Hare would boast to the other animals. "I am the fastest creature in the entire forest! No one can beat me!"\n\nOne day, a slow old Tortoise finally had enough of the Hare's boasting. "I challenge you to a race," said the Tortoise calmly.\n\nAll the animals burst out laughing — all except the Hare. He accepted the challenge, grinning with confidence. "A race? Against a slow tortoise? This will be the easiest thing I have ever done!"\n\nThe next morning, all the animals gathered at the starting line. The Fox waved a flag, and the race began.\n\nThe Hare shot off like an arrow, his legs a blur. In no time, he was far ahead of the Tortoise, who plodded along steadily — one step at a time. Slow and steady.\n\nThe Hare looked back and could barely see the Tortoise. He laughed out loud. "I have so much time! I will take a little nap here in the shade and still wake up in time to win."\n\nThe Hare lay down under a shady tree and quickly fell fast asleep.\n\nMeanwhile, the Tortoise kept going. Slowly but surely, one steady step after another, he passed the sleeping Hare.\n\nThe Hare finally woke up and stretched. "Time to finish the race," he yawned. But when he looked at the finish line, he gasped.\n\nThe Tortoise was just crossing it!\n\nAll the animals cheered. The Tortoise had won!\n\nThe Hare rushed to the finish line, out of breath and red-faced with embarrassment. He hung his head in shame.\n\nThe Tortoise smiled gently and said, "Slow and steady wins the race, my friend."\n\nMoral: Consistency, determination, and hard work will always overcome arrogance and overconfidence.`
                    },
                    "uploaded": {
                        title: sessionStorage.getItem('uploadedStoryName') || "Uploaded Story",
                        author: "Uploaded PDF",
                        icon: "fas fa-file-pdf",
                        content: sessionStorage.getItem('uploadedStoryText') || "No uploaded story found. Please go back and upload a PDF."
                    }
                };

                const story = stories[storyKey];
                if (story) {
                    titleEl.textContent = story.title;
                    authorEl.textContent = story.author;
                    document.getElementById('book-icon').className = story.icon;
                    document.getElementById('book-icon').style.cssText = 'font-size:4rem; color:var(--primary-color); margin-bottom:1rem;';
                    contentEl.textContent = story.content;
                    currentBookContent = story.content;
                } else {
                    titleEl.textContent = "Story Not Found";
                    contentEl.textContent = "Sorry, we could not find the story you requested.";
                }

            } else {
                titleEl.textContent = "No Book Selected";
                contentEl.textContent = "Please go back and select a book.";
            }

            // Audio Mode: Restore persisted state on load
            const audioToggleBook = document.getElementById('audio-mode-toggle');
            if (localStorage.getItem('audioModeActive') === 'true') {
                document.body.classList.add('high-contrast');
                if (audioToggleBook) audioToggleBook.innerHTML = '<i class="fas fa-volume-up"></i> Disable Audio Mode';
            }
            audioToggleBook.addEventListener('click', () => {
                const isActive = document.body.classList.toggle('high-contrast');
                localStorage.setItem('audioModeActive', isActive);
                audioToggleBook.innerHTML = isActive
                    ? '<i class="fas fa-volume-up"></i> Disable Audio Mode'
                    : '<i class="fas fa-headphones"></i> Audio Mode';
            });

            // TTS Logic
            document.getElementById('play-book').addEventListener('click', () => {
                if (!currentBookContent) return;

                synthesis.cancel(); // Stop previous
                currentUtterance = new SpeechSynthesisUtterance(currentBookContent);

                // Use Preferred Voice
                const preferredVoiceName = api.getPreferredVoice();
                if (preferredVoiceName) {
                    const voice = voices.find(v => v.name === preferredVoiceName);
                    if (voice) currentUtterance.voice = voice;
                }

                currentUtterance.rate = 0.9;

                // Simple highlight (optional, can be improved like module.html)
                currentUtterance.onstart = () => {
                    document.getElementById('play-book').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Reading...';
                }

                currentUtterance.onend = () => {
                    document.getElementById('play-book').innerHTML = '<i class="fas fa-play"></i> Read Aloud';
                }

                synthesis.speak(currentUtterance);
            });

            document.getElementById('pause-book').addEventListener('click', () => {
                if (synthesis.paused) synthesis.resume();
                else synthesis.pause();
            });

            document.getElementById('stop-book').addEventListener('click', () => {
                synthesis.cancel();
                document.getElementById('play-book').innerHTML = '<i class="fas fa-play"></i> Read Aloud';
            });
        });
    </script>
    <script src="script.js"></script>
    <button id="global-voice-btn" aria-label="Toggle Voice Control" title="Toggle Voice Control"><i class="fas fa-microphone-slash"></i></button>
</body>

</html>
