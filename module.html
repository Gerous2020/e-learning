<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Viewer - AccessLearn</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav aria-label="Module Navigation">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html"
                    style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Home</span>
                </a>
            </div>
            <div class="user-controls">
                <button id="voice-command-toggle" aria-label="Toggle Voice Commands"><i class="fas fa-microphone"></i>
                    Voice Control</button>
                <button id="audio-mode-toggle" aria-label="Toggle Audio Mode"><i class="fas fa-headphones"></i> Audio
                    Mode</button>
            </div>
        </div>
    </nav>

    <main id="main-content">
        <section class="module-container" style="max-width: 800px; margin: 2rem auto; padding: 2rem;">
            <div id="module-header" style="text-align: center; margin-bottom: 2rem;">
                <i id="module-icon" class="fas fa-book"
                    style="font-size: 4rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
                <h1 id="module-title">Loading Module...</h1>
            </div>

            <div class="card" style="padding: 3rem; font-size: 1.25rem; line-height: 1.8;">
                <div id="module-content">
                    Please select a valid module.
                </div>
            </div>

            <!-- Recommended Books Section -->
            <div id="module-books-container" class="card" style="margin-top: 2rem; padding: 2rem; display: none;">
                <h2 style="color: var(--primary-color); margin-bottom: 1rem;"><i class="fas fa-book-open"></i>
                    Recommended Books</h2>
                <ul id="module-books" style="list-style: none; padding: 0;">
                    <!-- Books will be injected here -->
                </ul>
            </div>

            <div class="controls"
                style="text-align: center; margin-top: 2rem; display: flex; gap: 1rem; justify-content: center;">
                <button id="play-module" class="cta-button"><i class="fas fa-play"></i> Read Aloud</button>
                <button id="pause-module" class="secondary-button"><i class="fas fa-pause"></i> Pause</button>
                <button id="stop-module" class="secondary-button"><i class="fas fa-stop"></i> Stop</button>
            </div>
        </section>
    </main>

    <!-- Sign Language Panel (Reused) -->
    <aside class="sign-language-panel" aria-label="Sign Language Interpreter" style="display: block;">
        <div class="sl-video-placeholder">
            <i class="fas fa-hands-asl-interpreting" id="sl-icon"></i>
            <p id="sl-text" style="font-size: 1.5rem; font-weight: bold; margin-top: 1rem;">...</p>
        </div>
        <div class="sl-controls">
            <small>Live Sign Sync</small>
        </div>
    </aside>

    <script src="sign_dictionary.js"></script>
    <script src="client-api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const moduleId = params.get('id');

            const titleEl = document.getElementById('module-title');
            const contentEl = document.getElementById('module-content');
            const iconEl = document.getElementById('module-icon');
            const slIcon = document.getElementById('sl-icon');
            const slText = document.getElementById('sl-text');

            let synthesis = window.speechSynthesis;
            let currentUtterance = null;
            let currentModuleContent = ""; // Store for TTS

            if (moduleId) {
                try {
                    // FETCH FROM API
                    const data = await api.getCourseById(moduleId);

                    if (data && data.title) {
                        titleEl.textContent = data.title;
                        contentEl.textContent = data.content || data.description;
                        iconEl.className = data.icon || 'fas fa-book';
                        currentModuleContent = contentEl.textContent;

                        // Render Books
                        if (data.books && data.books.length > 0) {
                            const booksContainer = document.getElementById('module-books-container');
                            const booksList = document.getElementById('module-books');
                            booksList.innerHTML = ''; // Clear existing

                            data.books.forEach((book, index) => {
                                const li = document.createElement('li');
                                li.style.marginBottom = '1rem';
                                li.style.padding = '1rem';
                                li.style.backgroundColor = '#f8f9fa';
                                li.style.borderRadius = '8px';
                                li.style.display = 'flex';
                                li.style.alignItems = 'center';
                                li.style.gap = '1rem';

                                li.innerHTML = `
                                    <i class="fas fa-book" style="color: var(--secondary-color); font-size: 1.5rem;"></i>
                                    <div style="flex: 1;">
                                        <h3 style="margin: 0; font-size: 1.2rem;">${book.title}</h3>
                                        <p style="margin: 0; color: #666;">by ${book.author}</p>
                                    </div>
                                    <a href="book.html?moduleId=${moduleId}&bookIndex=${index}" class="primary-button" style="text-decoration: none; padding: 0.5rem 1rem; background-color: var(--primary-color); color: white; border-radius: 5px; font-size: 0.9rem;">
                                        <i class="fas fa-book-open"></i> Read Now
                                    </a>
                                `;
                                booksList.appendChild(li);
                            });
                            booksContainer.style.display = 'block';
                        } else {
                            document.getElementById('module-books-container').style.display = 'none';
                        }

                    } else {
                        throw new Error('Module not found');
                    }
                } catch (err) {
                    titleEl.textContent = "Error Loading Module";
                    contentEl.textContent = "Could not connect to the Backend API. Please ensure the server is running.";
                    console.error(err);
                }
            } else {
                titleEl.textContent = "No Module Selected";
                contentEl.textContent = "Please go back to home and select a module.";
            }

            // Audio Mode: Restore persisted state on load
            const audioToggle = document.getElementById('audio-mode-toggle');
            if (localStorage.getItem('audioModeActive') === 'true') {
                document.body.classList.add('high-contrast');
                if (audioToggle) audioToggle.innerHTML = '<i class="fas fa-volume-up"></i> Disable Audio Mode';
            }

            audioToggle.addEventListener('click', () => {
                const isActive = document.body.classList.toggle('high-contrast');
                localStorage.setItem('audioModeActive', isActive);
                audioToggle.innerHTML = isActive
                    ? '<i class="fas fa-volume-up"></i> Disable Audio Mode'
                    : '<i class="fas fa-headphones"></i> Audio Mode';
            });

            // Play Logic with Sync
            document.getElementById('play-module').addEventListener('click', () => {
                if (!currentModuleContent) return;

                synthesis.cancel(); // Stop previous
                const text = currentModuleContent;
                currentUtterance = new SpeechSynthesisUtterance(text);

                // Use Preferred Voice
                let voices = synthesis.getVoices();
                const preferredVoiceName = api.getPreferredVoice();
                if (preferredVoiceName) {
                    const voice = voices.find(v => v.name === preferredVoiceName);
                    if (voice) currentUtterance.voice = voice;
                }

                currentUtterance.rate = 0.9;

                // SYNC IMPLEMENTATION
                currentUtterance.onboundary = (event) => {
                    if (event.name === 'word') {
                        // Get the word
                        const charIndex = event.charIndex;
                        const charLength = event.charLength || text.indexOf(' ', charIndex) - charIndex;
                        let word = text.substring(charIndex, charIndex + charLength).trim().replace(/[.,]/g, '');

                        if (word) {
                            word = word.toUpperCase();
                            slText.textContent = word;

                            // 1. Clean panel
                            const slContainer = document.querySelector('.sl-video-placeholder');
                            slContainer.innerHTML = '';
                            slContainer.style.background = "#fff";
                            slContainer.style.display = "flex";
                            slContainer.style.flexWrap = "wrap";
                            slContainer.style.justifyContent = "center";
                            slContainer.style.alignItems = "center";
                            slContainer.style.gap = "2px";
                            slContainer.style.padding = "10px";
                            slContainer.style.minHeight = "150px";
                            slIcon.style.display = 'none';

                            // 2. Loop characters for Fingerspelling
                            const cleanWord = word.trim().replace(/[^a-zA-Z]/g, '');

                            for (let char of cleanWord) {
                                const signSrc = typeof getFingerSpellingImage === 'function' ? getFingerSpellingImage(char) : null;
                                if (signSrc) {
                                    const img = document.createElement('img');
                                    img.src = signSrc;
                                    img.alt = `Sign ${char}`;
                                    img.title = char;
                                    img.style.width = "40px";
                                    img.style.height = "auto";
                                    img.style.margin = "2px";
                                    img.className = 'sign-img';
                                    slContainer.appendChild(img);
                                }
                            }

                            // 3. Label
                            const label = document.createElement('div');
                            label.textContent = word;
                            label.style.width = "100%";
                            label.style.textAlign = "center";
                            label.style.marginTop = "10px";
                            label.style.fontWeight = "bold";
                            label.style.color = "#333";
                            slContainer.appendChild(label);
                        }
                    }
                };

                currentUtterance.onend = () => {
                    // Reset UI when done
                    slIcon.style.display = 'inline-block';
                    slText.textContent = "...";
                    const existingImages = document.querySelector('.sl-video-placeholder').querySelectorAll('.sign-img');
                    existingImages.forEach(img => img.remove());
                };

                synthesis.speak(currentUtterance);
            });

            document.getElementById('pause-module').addEventListener('click', () => {
                if (synthesis.paused) synthesis.resume();
                else synthesis.pause();
            });

            document.getElementById('stop-module').addEventListener('click', () => {
                synthesis.cancel();
            });


            // Voice Control Logic
            const voiceBtn = document.getElementById('voice-command-toggle');
            if (voiceBtn && ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.lang = 'en-US';
                let isListening = false;

                recognition.onstart = () => {
                    isListening = true;
                    voiceBtn.innerHTML = '<i class="fas fa-microphone-slash"></i> Listening...';
                    voiceBtn.style.color = 'var(--accent-color)';
                };

                recognition.onend = () => {
                    isListening = false;
                    voiceBtn.innerHTML = '<i class="fas fa-microphone"></i> Voice Control';
                    voiceBtn.style.color = 'inherit';
                };

                recognition.onresult = (event) => {
                    const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
                    console.log('Voice Command:', transcript);

                    if (transcript.includes('start') || transcript.includes('read')) {
                        document.getElementById('play-module').click();
                    } else if (transcript.includes('stop')) {
                        document.getElementById('stop-module').click();
                    } else if (transcript.includes('pause')) {
                        document.getElementById('pause-module').click();
                    }
                };

                voiceBtn.addEventListener('click', () => {
                    if (isListening) recognition.stop();
                    else recognition.start();
                });
            } else if (voiceBtn) {
                voiceBtn.style.display = 'none';
            }
        });
    </script>
    <script src="script.js"></script>
    <button id="global-voice-btn" aria-label="Toggle Voice Control" title="Toggle Voice Control"><i class="fas fa-microphone-slash"></i></button>
</body>

</html>
